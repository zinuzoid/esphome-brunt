esphome:
  name: brunt-blind
  friendly_name: Blind

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG   # keep the UARTs free

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components

uart:
  id: stm32_status
  rx_pin: GPIO4          # -> STM32 pin 21 (PB10, USART3 TX) via 1k series resistor
  baud_rate: 9600

cover:
  - platform: brunt
    name: Blind
    device_class: shade
    uart_id: stm32_status
    # Buttons are expected to be active-low (switch shorts a pulled-up line to GND).
    # Open-drain + inverted: "pressed" pulls the line low, "released" lets it float back up.
    up_pin:
      number: GPIO5
      inverted: true
      mode:
        output: true
        open_drain: true
    down_pin:
      number: GPIO6
      inverted: true
      mode:
        output: true
        open_drain: true
    press_duration: 200ms
    stop_latency: 100ms     # raise if it stops past the target, lower if it stops short
    motor_load:
      name: Blind motor load
      disabled_by_default: true
    encoder:
      name: Blind encoder
      disabled_by_default: true
